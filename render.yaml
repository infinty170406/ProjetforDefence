# Render.com Blueprint Configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: guardian-backend
    runtime: docker
    region: frankfurt
    plan: free
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: guardian-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: guardian-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: guardian-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: guardian-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: guardian-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: guardian-db
          property: connectionString
      - key: THE_GUARDIAN_JWT_SECRET
        generateValue: true
      - key: THE_GUARDIAN_EXECUTE_APIKEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: GOOGLE_API_KEY
        sync: false
      - key: REDIS_HOST
        fromService:
          type: redis
          name: guardian-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: guardian-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: guardian-redis
          property: password
      - key: SPRING_MAIL_HOST
        sync: false

databases:
  - name: guardian-db
    region: frankfurt
    plan: free

redis:
  - name: guardian-redis
    region: frankfurt
    plan: free
    ipAllowList: [] # Only allow internal access
