# Render.com Blueprint Configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: guardian-backend
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: guardian-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: guardian-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: guardian-db
          property: password
      - key: THE_GUARDIAN_JWT_SECRET
        generateValue: true
      - key: THE_GUARDIAN_EXECUTE_APIKEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

databases:
  - name: guardian-db
    plan: free
    region: frankfurt
