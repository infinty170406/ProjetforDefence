name: the_guardian
description: A parental control app with AI-powered monitoring
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  fl_chart: ^0.69.0

  # Navigation
  go_router: ^14.6.3

  # Network
  http: ^1.2.0
  dio: ^5.4.0
  web_socket_channel: ^3.0.1
  stomp_dart_client: ^2.0.0
  app_links: ^6.3.2

  # Storage / State
  shared_preferences: ^2.3.5
  provider: ^6.1.2
  intl: ^0.19.0

  # Map & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^12.0.0

  # Media & Share
  image_picker: ^1.1.2
  url_launcher: ^6.3.0          # WhatsApp / SMS sharing (details_enfant_screen)

  # Firebase — versions alignées sur BOM 33.1.0
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.1
  firebase_messaging: ^15.1.3   # FCM push notifications (SOS alerts)

  # Google Sign-In
  google_sign_in: ^6.2.1        # Google auth button (login / signup screens)
  cloud_functions: ^5.1.3
  tflite_v2: ^1.0.0
  flutter_local_notifications: ^21.0.0
  camera: ^0.12.0+2
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 23
  adaptive_icon_background: "assets/logo.png"
  adaptive_icon_foreground: "assets/empty.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/guardian_logo.svg
    - assets/laptop_dashboard_display.png
    - assets/smartphone_app_display.png
    - assets/model/
