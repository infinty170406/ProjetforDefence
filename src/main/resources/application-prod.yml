spring:
  mail:
    host: smtp.gmail.com
    port: 465
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        transport:
          protocol: smtps
        smtps:
          auth: true
          ssl:
            enable: true
            checkserveridentity: true
            trust: "*"
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          timeout: 10000
          connectiontimeout: 10000
          writetimeout: 10000
        smtp:
          ssl:
            enable: true

management:
  health:
    mail:
      enabled: false

logging:
  level:
    org.springframework.mail: DEBUG
    org.eclipse.angus.mail: DEBUG
    com.example.the_guardian_v1: INFO
