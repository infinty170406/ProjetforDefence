spring.application.name=The_guardian
server.port=5780

# Database PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/The_Guardian
spring.datasource.username=postgres
spring.datasource.password=ange
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=your-super-secret-key-change-this-in-production-min-256-bits-long
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

# Logging
logging.level.com.theguardian=DEBUG
logging.level.org.springframework.security=DEBUG