# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/The_Guardian
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=ange

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 Console
spring.h2.console.enabled=false

# JWT Configuration (CRITICAL)
jwt.secret=YourSuperSecretKeyForJWTTokenGenerationMinimum256BitsLongForHS256Algorithm
jwt.expiration-ms=86400000
jwt.child-token-expiration-ms=31536000000

# Server
server.port=5780
server.error.include-message=always
server.error.include-binding-errors=always

# Logging
logging.level.com.example.the_guardian=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.mail=DEBUG